name: Deploy to GitHub Pages

# Builds the static site and publishes it to https://spicyfalcon619.github.io.
# It also runs every day, so the GitHub stats and contribution heatmap stay fresh.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Google Fonts is fetched during the build and now and then fails on the runner: try once more
      - run: npm run build || (sleep 20 && npm run build)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
